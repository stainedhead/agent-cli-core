name: CI

# Implements BLD-1..BLD-6 of the PRD (CI/CD section). Pull requests and manual
# runs only: there is no release, publish or deploy job, no secret beyond the
# default read-only token. The downstream job only reads public consumer repos.

on:
  pull_request:
  workflow_dispatch:

# Least privilege: the workflow can only read this repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tool versions are pinned here so a run is reproducible. Actions are pinned
  # to a release tag; pinning them to commit SHAs needs network access and is
  # tracked as a follow-up.
  GOLANGCI_LINT_VERSION: v2.14.0
  GOVULNCHECK_VERSION: v1.8.0

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Download modules
        run: go mod download
      - name: go mod tidy leaves no diff
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain -- go.mod go.sum)" ]; then
            git status --porcelain -- go.mod go.sum
            git diff -- go.mod go.sum
            echo "::error::go mod tidy changed go.mod or go.sum; run it and commit the result"
            exit 1
          fi
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test (race detector, coverage)
        run: go test -race -cover ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

  # The tests also run natively on the Apple-silicon target, because file
  # permission checks in the policy package differ by platform.
  test-darwin:
    name: test darwin/arm64
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go test (race detector)
        run: go test -race ./...

  # BLD-3: every supported target is compiled on each PR. Windows users run the
  # Linux build under WSL, so there is no windows target. A library has no
  # binary, so this is a compile check of every package, tests included.
  cross-build:
    name: compile ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build ./...
          go vet ./...

  # Backward-compatibility check: builds, vets and tests each published consumer
  # (their main branch) against THIS pull request's core, so a change that breaks
  # snow-cli, outlook-cli or teams-cli is caught before release. The consumers are
  # public, so no credential is needed beyond the default read-only token. A
  # go.work file in the parent directory points both modules at the local
  # checkouts; the consumer's go.mod is never edited, so its own guard tests
  # (no replace directive, no pseudo-version) still run and pass.
  downstream:
    name: downstream ${{ matrix.consumer }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        consumer: [snow-cli, outlook-cli, teams-cli]
    steps:
      - name: Checkout core (this pull request)
        uses: actions/checkout@v7
        with:
          path: core
          persist-credentials: false
      - name: Checkout consumer (main)
        uses: actions/checkout@v7
        with:
          repository: stainedhead/${{ matrix.consumer }}
          ref: main
          path: consumer
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: |
            core/go.sum
            consumer/go.sum
      - name: Use the local core through a go.work file
        run: |
          printf 'go 1.27\n\nuse (\n\t./core\n\t./consumer\n)\n' > go.work
          go list -m -f '{{.Path}} -> {{.Dir}}' github.com/stainedhead/agent-cli-core
      - name: Build
        working-directory: consumer
        run: go build ./...
      - name: Vet
        working-directory: consumer
        run: go vet ./...
      - name: Test
        working-directory: consumer
        run: go test -race ./...
