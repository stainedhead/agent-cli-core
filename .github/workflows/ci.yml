name: CI

# Implements the BLD-1..BLD-6 requirements in this repository's PRD (CI/CD section).
# Steps that need Go source are skipped while the repository has no .go files, so
# CI passes trivially now and starts enforcing as soon as code lands.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  GOPRIVATE: github.com/stainedhead/*
  GOLANGCI_LINT_VERSION: v2.14.0
  GOVULNCHECK_VERSION: v1.8.0

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Authenticate module fetches with the job token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Download modules
        run: go mod download
      - name: go mod tidy leaves no diff
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain -- go.mod go.sum)" ]; then
            git status --porcelain -- go.mod go.sum
            git diff -- go.mod go.sum
            echo "::error::go mod tidy changed go.mod or go.sum; run it and commit the result"
            exit 1
          fi
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: go vet
        if: hashFiles('**/*.go') != ''
        run: go vet ./...
      - name: go test
        if: hashFiles('**/*.go') != ''
        run: go test -race ./...
      - name: golangci-lint
        if: hashFiles('**/*.go') != ''
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      - name: govulncheck
        if: hashFiles('**/*.go') != ''
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

  # BLD-3: every release target is cross-compiled on each PR. Windows users run the
  # Linux build under WSL, so there is no windows target.
  cross-build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64, runner: macos-14 }
          - { goos: linux, goarch: amd64, runner: ubuntu-latest }
          - { goos: linux, goarch: arm64, runner: ubuntu-latest }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Authenticate module fetches with the job token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Download modules
        run: go mod download
      - name: Build
        if: hashFiles('**/*.go') != ''
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # Linux targets are static. The darwin build runs natively on an Apple-silicon
          # runner with cgo left on, because Keychain-backed code may need it.
          CGO_ENABLED: ${{ matrix.goos == 'linux' && '0' || '1' }}
        run: go build ./...

  # BLD-7: build and test each consumer against this version of the core, using a
  # replace directive that exists only in this job's checkout and is never committed.
  # A consumer that does not require the core yet has nothing to check.
  downstream:
    name: downstream ${{ matrix.repo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: [snow-cli, outlook-cli, teams-cli]
    steps:
      - uses: actions/checkout@v7
        with:
          path: core
      - uses: actions/checkout@v7
        with:
          repository: stainedhead/${{ matrix.repo }}
          path: consumer
      - uses: actions/setup-go@v7
        with:
          go-version-file: consumer/go.mod
      - name: Authenticate module fetches with the job token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Build and test against this version of the core
        working-directory: consumer
        run: |
          if ! grep -q 'github.com/stainedhead/agent-cli-core' go.mod; then
            echo "::notice::${{ matrix.repo }} does not require agent-cli-core yet; nothing to check"
            exit 0
          fi
          go mod edit -replace github.com/stainedhead/agent-cli-core=../core
          go mod tidy
          go build ./...
          go test -race ./...
