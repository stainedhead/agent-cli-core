version: "2"
linters:
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - revive
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
  exclusions:
    rules:
      # Doc-comment rules apply to the public API, not to tests.
      - path: _test\.go
        linters:
          - revive
formatters:
  enable:
    - gofmt
